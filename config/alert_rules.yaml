alerts:
  - name: chat_latency_slo_breach
    severity: warning
    condition: "P95 response_sent.latency_ms > 3000 ms"
    duration: 5m
    type: symptom-based
    channel: "#llmops-alerts"
    owner: "LLMOps on-call"
    runbook: docs/alerts.md#alert-1
  - name: chat_error_rate_high
    severity: critical
    condition: "request_failed / request_received > 2%"
    duration: 5m
    type: symptom-based
    channel: "#llmops-alerts"
    owner: "API on-call"
    runbook: docs/alerts.md#alert-2
  - name: retrieval_success_degraded
    severity: warning
    condition: "retrieval tool_success rate < 90%"
    duration: 10m
    type: symptom-based
    channel: "#llmops-alerts"
    owner: "RAG on-call"
    runbook: docs/alerts.md#alert-3
